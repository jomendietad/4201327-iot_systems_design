<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1122 350" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<defs><marker id="a-ink" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#0f172a"/></marker><marker id="a-muted" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#475569"/></marker><marker id="a-c1" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#ea580c"/></marker><marker id="a-c2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#2563eb"/></marker><marker id="a-c3" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#16a34a"/></marker><marker id="a-c4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#0d9488"/></marker><marker id="a-c5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#e11d48"/></marker><marker id="a-c6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#7c3aed"/></marker><marker id="a-c7" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#d97706"/></marker><marker id="a-c8" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#db2777"/></marker><marker id="a-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0 0 L14 6 L0 12 Z" fill="#475569"/></marker></defs>
<rect x="20.0" y="24.0" width="270.0" height="76.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="155.0" y="58.0" text-anchor="middle" font-size="21" font-weight="700" fill="#d97706">sampler thread</text>
<text x="155.0" y="81.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0f172a">reads the sensor</text>
<rect x="20.0" y="124.0" width="270.0" height="76.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="155.0" y="158.0" text-anchor="middle" font-size="21" font-weight="700" fill="#d97706">system workqueue</text>
<text x="155.0" y="181.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0f172a">Observe, health, fail-safe</text>
<line x1="292.0" y1="62.0" x2="366.0" y2="98.0" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<line x1="292.0" y1="162.0" x2="366.0" y2="126.0" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<text x="330.0" y="66.0" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">feed</text>
<rect x="370.0" y="74.0" width="240.0" height="76.0" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
<text x="490.0" y="108.0" text-anchor="middle" font-size="21" font-weight="700" fill="#e11d48">task watchdog</text>
<text x="490.0" y="131.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0f172a">10 s per channel</text>
<line x1="612.0" y1="112.0" x2="690.0" y2="112.0" stroke="#e11d48" stroke-width="3" marker-end="url(#a-c5)"/>
<text x="651.0" y="94.0" text-anchor="middle" font-size="18" font-weight="700" fill="#e11d48">starved</text>
<rect x="694.0" y="80.0" width="130.0" height="64.0" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
<text x="759.0" y="119.3" text-anchor="middle" font-size="22" font-weight="700" fill="#e11d48">reset</text>
<rect x="370.0" y="232.0" width="240.0" height="60.0" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="490.0" y="268.7" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">hardware watchdog</text>
<polyline points="490.0,232.0 490.0,154.0" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a-gray)"/>
<text x="502.0" y="200.0" text-anchor="start" font-size="17" font-weight="400" fill="#475569">if the task watchdog itself stops</text>
<line x1="826.0" y1="112.0" x2="868.0" y2="112.0" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<rect x="872.0" y="74.0" width="230.0" height="76.0" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="987.0" y="108.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0d9488">boot, rejoin</text>
<text x="987.0" y="131.0" text-anchor="middle" font-size="17" font-weight="400" fill="#0f172a">stored network</text>
<line x1="987.0" y1="152.0" x2="987.0" y2="228.0" stroke="#0f172a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<rect x="872.0" y="232.0" width="230.0" height="60.0" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="987.0" y="269.0" text-anchor="middle" font-size="21" font-weight="700" fill="#7c3aed">green again</text>
<text x="20.0" y="334.0" text-anchor="start" font-size="20" font-weight="400" fill="#475569">a hang becomes a reboot, and a reboot is something the system already survives</text>
</svg>
